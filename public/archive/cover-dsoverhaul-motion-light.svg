<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  .anim { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  .center { transform-box: fill-box; transform-origin: center; }

  #camera { transform-origin: 600px 315px; animation-name: camera; }
  @keyframes camera {
    0%, 6% { transform: translate(0, 0) scale(1); }
    32% { transform: translate(0, 0) scale(1.12); }
    36% { transform: translate(0, 0) scale(1.15); }
    40% { transform: translate(0, 0) scale(1.12); }
    54% { transform: translate(0, -150px) scale(1.1); }
    84% { transform: translate(0, -166px) scale(1.16); }
    100% { transform: translate(0, 0) scale(1); }
  }
  #cursor { transform: translate(600px, 304px); animation-name: cursor; }
  @keyframes cursor {
    0%, 8% { transform: translate(1010px, 780px); }
    32%, 46% { transform: translate(600px, 304px); }
    62%, 84% { transform: translate(742px, 352px); }
    100% { transform: translate(1010px, 780px); }
  }
  #cursor-press, #add { animation-name: press; }
  @keyframes press {
    0%, 34% { transform: scale(1); }
    37% { transform: scale(0.84); }
    41%, 100% { transform: scale(1); }
  }
  #add-fill { animation-name: add-fill; }
  @keyframes add-fill {
    0%, 34% { fill: #0B0B0B; }
    37% { fill: #4A4A4A; }
    42%, 100% { fill: #0B0B0B; }
  }
  #edge { animation-name: edge; }
  @keyframes edge {
    0%, 39% { transform: translateY(0); }
    54%, 86% { transform: translateY(160px); }
    98%, 100% { transform: translateY(0); }
  }
  .side { transform-box: view-box; transform-origin: 0 -200px; animation-name: side; }
  @keyframes side {
    0%, 39% { transform: scaleY(1); }
    54%, 86% { transform: scaleY(1.31746); }
    98%, 100% { transform: scaleY(1); }
  }
  #variant { opacity: 0; animation-name: variant; }
  @keyframes variant {
    0%, 40% { opacity: 0; transform: scale(0.92); }
    54%, 80% { opacity: 1; transform: scale(1); }
    88%, 100% { opacity: 0; transform: scale(1); }
  }
  #selection, #redline, #count-4 { opacity: 0; animation-name: reveal; }
  @keyframes reveal {
    0%, 50% { opacity: 0; }
    55%, 80% { opacity: 1; }
    86%, 100% { opacity: 0; }
  }
  #count-3 { animation-name: conceal; }
  @keyframes conceal {
    0%, 50% { opacity: 1; }
    55%, 80% { opacity: 0; }
    86%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
<defs>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1.4" fill="#000000" fill-opacity="0.22"/>
  </pattern>
  <radialGradient id="vignette" cx="600" cy="315" r="720" gradientUnits="userSpaceOnUse">
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
  </radialGradient>
</defs>

<rect width="1200" height="630" fill="#FFFFFF"/>

<g id="camera" class="anim">
  <rect x="-400" y="-400" width="2000" height="1600" fill="url(#dots)"/>
  <g transform="translate(0 96)">

  <g stroke="#000000" stroke-opacity="0.16" stroke-width="1">
    <line x1="380" y1="-400" x2="380" y2="1200"/>
    <line x1="820" y1="-400" x2="820" y2="1200"/>
    <line x1="-400" y1="120" x2="1600" y2="120"/>
    <line x1="-400" y1="224" x2="1600" y2="224"/>
  </g>

  <g fill="#000000" fill-opacity="0.5">
    <rect class="side anim" x="299" y="-200" width="2" height="504"/>
    <rect class="side anim" x="899" y="-200" width="2" height="504"/>
  </g>

  <g class="sans" font-size="34" font-weight="600" text-anchor="middle">
    <rect x="380" y="-40" width="440" height="104" rx="22" fill="#0B0B0B"/>
    <text x="600" y="24" fill="#FFFFFF">Button</text>
    <rect x="381.5" y="121.5" width="437" height="101" rx="20.5" stroke="#B5B5B5" stroke-width="3"/>
    <text x="600" y="184" fill="#0B0B0B">Button</text>
  </g>

  <g id="variant" class="anim center">
    <rect x="381.5" y="281.5" width="437" height="101" rx="20.5" stroke="#B5B5B5" stroke-width="3"/>
    <text class="sans" x="600" y="344" fill="#0B0B0B" font-size="34" font-weight="600" text-anchor="middle">Button</text>
  </g>
  <g id="selection" class="anim">
    <rect x="380" y="280" width="440" height="104" stroke="#0B0B0B" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#0B0B0B" stroke-width="2">
      <rect x="373" y="273" width="14" height="14"/>
      <rect x="813" y="273" width="14" height="14"/>
      <rect x="373" y="377" width="14" height="14"/>
      <rect x="813" y="377" width="14" height="14"/>
    </g>
  </g>
  <g id="redline" class="anim" stroke="#0B0B0B" stroke-width="1.5">
    <line x1="860" y1="226" x2="860" y2="278"/>
    <line x1="852" y1="226" x2="868" y2="226"/>
    <line x1="852" y1="278" x2="868" y2="278"/>
    <text class="mono" x="878" y="258" fill="#0B0B0B" stroke="none" font-size="18">56</text>
  </g>

  <g id="edge" class="anim">
    <rect x="299" y="303" width="602" height="2" fill="#000000" fill-opacity="0.5"/>
    <g id="add" class="anim center">
      <circle id="add-fill" class="anim" cx="600" cy="304" r="28" fill="#0B0B0B"/>
      <path d="M600 290V318M586 304H614" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g id="cursor" class="anim">
    <g id="cursor-press" class="anim">
      <path transform="scale(2.1)" d="M0 0V24.5L6.4 18.6L10.4 27.8L14.6 26L10.7 17H19.2Z" fill="#0B0B0B" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>
  </g>
</g>

<rect width="1200" height="630" fill="url(#vignette)"/>

<g class="mono" font-size="20" fill="#6B6B6B">
  <text x="48" y="64">Button</text>
  <text id="count-3" class="anim" x="48" y="94">variants: 3</text>
  <text id="count-4" class="anim" x="48" y="94">variants: 4</text>
</g>
</svg>
